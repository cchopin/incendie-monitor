# Site incendie.tely.info -> backend uvicorn 127.0.0.1:8081
#
# Particularité de ce VPS : sshd occupe le port 443, nginx ne peut PAS y
# écouter (un listen 443 ici ferait échouer silencieusement tous les reload).
# Le HTTPS public est assuré par Cloudflare (proxy orange) :
#   - mode Flexible : Cloudflare -> origine en HTTP port 80
#   - mode Full (strict) possible via une Origin Rule Cloudflare qui réécrit
#     le port de destination vers 8443 (certificat Let's Encrypt ci-dessous)
# Renouvellement : certbot renew passe par le challenge HTTP sur le port 80.

server {
    listen 80;
    listen [::]:80;
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name incendie.tely.info;

    ssl_certificate /etc/letsencrypt/live/incendie.tely.info/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/incendie.tely.info/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # En-têtes propres au site : leur présence désactive l'héritage du CSP
    # global de conf.d/security.conf (pensé pour Wazuh/n8n), trop strict ici
    # (bloque Leaflet sur cdnjs et les fonds de carte cartocdn).
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; img-src 'self' data: blob: https:; connect-src 'self' https:; font-src 'self' data:; frame-ancestors 'self';" always;

    # les tuiles peuvent être lourdes, on laisse le temps au premier rendu EFFIS
    proxy_read_timeout 60s;
    proxy_connect_timeout 10s;

    # petit cache navigateur sur les tuiles déjà servies
    location /wms/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1h;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
